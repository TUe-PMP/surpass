[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "surpass-semiconductor"
version = "1.0.0"
description = "Surface and Passivation Analysis for Semiconductor Systems"
readme = "README.md"
requires-python = ">=3.10"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [
  {name = "Bart Macco", email = "b.macco@tue.nl"},
]
maintainers = [
  {name = "Bart Macco", email = "b.macco@tue.nl"},
]
keywords = [
  "semiconductor physics",
  "surface passivation",
  "interface states",
  "photoluminescence",
  "carrier transport",
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Physics",
]
dependencies = ["numpy>=2.0", "scipy>=1.10", "matplotlib>=3.7", "pandas>=2.0"]

[project.optional-dependencies]
notebook = ["jupyterlab>=4", "nbformat>=5", "scienceplots>=2"]
dev = ["build>=1", "pytest>=8", "twine>=5"]

[project.urls]
Homepage = "https://github.com/TUe-PMP/surpass"
Repository = "https://github.com/TUe-PMP/surpass"
Issues = "https://github.com/TUe-PMP/surpass/issues"

[tool.setuptools.packages.find]
where = ["src"]
